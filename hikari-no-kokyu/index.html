<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>光の呼吸</title>
<style>
  /* OKLCH グラデーションがゆっくり回転し、中心の光と周縁の陰りが非対称のリズムで呼吸する */
  :root {
    --ink: rgba(255,255,255,0.86);
    --ink-dim: rgba(255,255,255,0.6);
    --chip: rgba(0,0,0,0.2);
    --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: oklch(0.72 0.11 30);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 8px 12px;
    align-items: center;
    pointer-events: none;
    transition: opacity .8s ease;
  }
  .panel.off { opacity: 0; }
  .chip {
    background: var(--chip);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    letter-spacing: .04em;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .hint { color: var(--ink-dim); margin-left: auto; }
  .ctrl { pointer-events: auto; cursor: default; }
  .slider { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; max-width: 340px; }
  .slider label { white-space: nowrap; min-width: 3em; }
  .slider input { flex: 1; min-width: 0; accent-color: #fff; }
  .slider output { min-width: 7.5em; text-align: right; }
  input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Zen+Kaku+Gothic+New:wght@400&display=swap">

<div class="panel" id="panel">
  <div class="chip slider ctrl">
    <label for="speed">速さ</label>
    <input type="range" id="speed" min="0" max="100" step="1" value="40">
    <output class="num" id="speedOut" for="speed">一周 2分</output>
  </div>
  <div class="chip slider ctrl">
    <label for="spread">色の幅</label>
    <input type="range" id="spread" min="0" max="360" step="5" value="120">
    <output class="num" id="spreadOut" for="spread">120°</output>
  </div>
  <div class="chip slider ctrl">
    <label for="breath">呼吸</label>
    <input type="range" id="breath" min="0" max="100" step="1" value="60">
    <output class="num" id="breathOut" for="breath">深い</output>
  </div>
  <span class="chip hint" id="hint">タップで一時停止／再開</span>
</div>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 色の流れ・回転 ----
  const L0 = 0.72, C = 0.11, STOPS = 17;
  const MIN_DPS = 0.3, MAX_DPS = 60;      // 色相の速さ：一周20分〜6秒
  const ANGLE_DPS = 1.5;                  // グラデーションの向きは一定速度でゆっくり回る

  // ---- 呼吸のリズム：吸う 4 秒 → 吐く 5 秒 → 間 1 秒（非対称） ----
  const IN = 4, OUT = 5, HOLD = 1, CYCLE = IN + OUT + HOLD;
  function breathCurve(time) {
    const p = time % CYCLE;
    if (p < IN) return (1 - Math.cos(Math.PI * p / IN)) / 2;              // 吸う：静かに始まり、静かに満ちる
    if (p < IN + OUT) {
      const x = (p - IN) / OUT;
      return (1 + Math.cos(Math.PI * Math.pow(x, 0.8))) / 2;              // 吐く：ほどけるように始まり、長く引く
    }
    return 0;                                                            // 間
  }

  let degPerSec = reduce ? 1 : 3;
  let spread = 120, breath = 0.6;
  let hue = 30, angle = 120;
  let t = 0;                              // 作品内の時計（一時停止中は止まる）
  let running = true, last = performance.now(), idle = 0;
  let W = innerWidth, H = innerHeight;
  addEventListener('resize', () => { W = innerWidth; H = innerHeight; paint(); });

  const body = document.body;
  const panel = document.getElementById('panel');
  const hint = document.getElementById('hint');

  function paint() {
    const s = [];
    for (let i = 0; i < STOPS; i++) {
      const h = (hue + spread * i / (STOPS - 1)) % 360;
      s.push(`oklch(${L0} ${C} ${h.toFixed(1)}) ${(100 * i / (STOPS - 1)).toFixed(1)}%`);
    }
    const base = `linear-gradient(${angle.toFixed(1)}deg, ${s.join(', ')})`;

    const b = breathCurve(t), d = breath;
    const m = Math.min(W, H), half = Math.hypot(W, H) / 2;

    // 一：中心の光。吸うと広がり、吐くと縮む
    const gR = m * (0.28 + 0.50 * d * b);
    const gA = d * (0.06 + 0.16 * b);
    const glow = `radial-gradient(circle ${gR.toFixed(1)}px at 50% 50%, ` +
      `rgba(255,252,246,${gA.toFixed(3)}) 0%, ` +
      `rgba(255,252,246,${(gA * 0.55).toFixed(3)}) 45%, ` +
      `rgba(255,252,246,0) 100%)`;

    // 二：周縁の陰り。吸うと外へ退いて画面が開き、吐くと内へ寄る
    const vIn = half * (0.30 + 0.45 * b);
    const vA = d * (0.42 - 0.22 * b);
    const vig = `radial-gradient(circle ${(half * 1.02).toFixed(1)}px at 50% 50%, ` +
      `rgba(0,0,0,0) ${vIn.toFixed(1)}px, ` +
      `rgba(0,0,0,${(vA * 0.45).toFixed(3)}) ${((vIn + half) / 2).toFixed(1)}px, ` +
      `rgba(0,0,0,${vA.toFixed(3)}) 100%)`;

    body.style.background = `${vig}, ${glow}, ${base}`;
  }

  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (running) {
      t += dt;
      hue = (hue + degPerSec * dt) % 360;
      angle = (angle + ANGLE_DPS * dt) % 360;
      paint();
    }
    idle += dt;
    panel.classList.toggle('off', running && idle > 4);
    requestAnimationFrame(tick);
  }

  body.addEventListener('click', () => {
    running = !running; idle = 0;
    hint.textContent = running ? 'タップで一時停止／再開' : '停止中 — タップで再開';
  });
  addEventListener('pointermove', () => { idle = 0; });

  // ---- 操作 ----
  const $ = id => document.getElementById(id);

  const toSpeed = v => MIN_DPS * Math.pow(MAX_DPS / MIN_DPS, v / 100);
  const fromSpeed = d => Math.round(100 * Math.log(d / MIN_DPS) / Math.log(MAX_DPS / MIN_DPS));
  function showSpeed() {
    const sec = 360 / degPerSec;
    $('speedOut').textContent = sec >= 60 ? `一周 ${(sec / 60).toFixed(sec >= 600 ? 0 : 1)}分` : `一周 ${Math.round(sec)}秒`;
  }
  $('speed').value = fromSpeed(degPerSec);
  $('speed').addEventListener('input', e => { degPerSec = toSpeed(+e.target.value); showSpeed(); });

  function showSpread() {
    $('spreadOut').textContent = spread === 0 ? '0°（一色）' : spread === 360 ? '360°（全色）' : `${spread}°`;
  }
  $('spread').addEventListener('input', e => { spread = +e.target.value; showSpread(); paint(); });

  function showBreath() {
    const v = breath * 100;
    $('breathOut').textContent = v === 0 ? 'なし' : v < 25 ? 'かすか' : v < 60 ? 'ふつう' : v < 85 ? '深い' : 'とても深い';
  }
  $('breath').addEventListener('input', e => { breath = +e.target.value / 100; showBreath(); paint(); });

  document.querySelectorAll('.ctrl').forEach(el =>
    ['click', 'pointerdown'].forEach(ev => el.addEventListener(ev, e => { e.stopPropagation(); idle = 0; })));

  showSpeed(); showSpread(); showBreath();
  paint();
  requestAnimationFrame(tick);
</script>

</body></html>
