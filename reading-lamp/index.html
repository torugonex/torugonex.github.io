  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .level {

  .level.mini { font-family: "JetBrains Mono", monospace; padding: 0 6px; margin-right: 8px; letter-spacing: 0; }
  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pool-note { font-size: 0.8rem; color: var(--ink-faint); margin: 16px 0 0; }

            "The cost of services across a wide area kept rising as the population aged and shrank.",
            "The railway company asked the city for help.",
            "Cars were banned in the city center."
          ],
          correct: 1,
          evidence: "the cost of maintaining roads, water pipes, and other services across a wide area kept rising",
          explain: "郊外に広がった結果、広い範囲のインフラ維持費が増え続け、しかも人口減少・高齢化が見込まれていた、という理由です。"
        },
        {
          type: "Detail",
          q: "What was the city's basic approach?",
          options: [
            "Forcing residents to move to the center",
            "Making life near public transport more attractive",
            "Building more highways in the suburbs",
            "Raising the price of train tickets"
          ],
          correct: 1,
          evidence: "Rather than forcing people to move",
          explain: "Rather than A, B（Aではなく B）。強制ではなく、公共交通沿いに住む魅力を高める方法をとりました。"
        },
        {
          type: "Reading skill",
          q: "What is the role of paragraph 3?",
          options: [
            "To describe the history of Toyama before 1900",
            "To evaluate the results of the policy",
            "To explain how trams are built",
            "To introduce a new policy for the future"
          ],
          correct: 1,
          evidence: "The results have been mixed but encouraging.",
          explain: "第1段落＝問題、第2段落＝対策、第3段落＝結果の評価。段落の役割を追う問題です。"
        },
        {
          type: "Inference",
          q: "Which best describes the writer's view of Toyama's policy?",
          options: [
            "A complete failure",
            "A quick and total success",
            "A partly successful effort that needs a long time",
            "An idea that no other city should copy"
          ],
          correct: 2,
          evidence: "reshaping a city is possible, but only slowly, over decades rather than years",
          explain: "mixed but encouraging（まだら模様だが希望が持てる）、そして「数年でなく数十年かけてゆっくり」。Cが筆者の見方に合います。"
        }
      ],
      summaryPrompt: "富山市が何をしたか、その結果どうだったかを、2文程度の英語でまとめてみましょう。"
    }
  ];

  /* ---------- sets: 2 Standard + 2 Advanced, least-read first ---------- */
  const SET_SIZE_PER_LEVEL = 2;
  const SEEN_KEY = "reading-lamp-seen";
  const LETTERS = "ABCD";
  function loadSeen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; } }
  function saveSeen(s) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch (e) {} }
  let seen = loadSeen();

  function pickSet(exclude) {
    const pick = level => POOL
      .filter(p => p.level === level)
      .map(p => ({ p, n: (seen[p.title] || 0) + (exclude.includes(p.title) ? 100 : 0), r: Math.random() }))
      .sort((a, b) => a.n - b.n || a.r - b.r)
      .slice(0, SET_SIZE_PER_LEVEL)
      .map(x => x.p);
    const s = pick("Standard"), a = pick("Advanced"), out = [];
    for (let i = 0; i < SET_SIZE_PER_LEVEL; i++) out.push(s[i], a[i]);
    return out.map(p => ({ ...p, questions: p.questions.map(shuffleQuestion) }));
  }

  // Shuffle option order; letters mentioned in the explanation (e.g. "Bが正解", "A・Bは") follow the new order.
  function shuffleQuestion(q) {
    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const newPos = [];
    order.forEach((oldIdx, newIdx) => { newPos[oldIdx] = newIdx; });
    const explain = q.explain.replace(/(^|[^A-Za-z])([A-D])(?=[・はがのと])/g,
      (m, pre, L) => pre + LETTERS[newPos[LETTERS.indexOf(L)]]);
    return { ...q, options: order.map(i => q.options[i]), correct: newPos[q.correct], explain };
  }

  let setNo = 1;
  let PASSAGES = pickSet([]);
  let pIdx = 0;
  let timer = null;               // {start, handle}
  let wpmResults, quizState;
  function resetSetState() {
    pIdx = 0;
    wpmResults = PASSAGES.map(() => null);
    quizState = PASSAGES.map(p => new Array(p.questions.length).fill(null));
  }
  resetSetState();

  let sampleFn = null;
  (async () => {
    try {
      if (typeof claude !== "undefined" && claude && claude.use) sampleFn = await claude.use("sample");
    } catch (e) { sampleFn = null; }
  })();

  const app = document.getElementById("app");
  const passageCountEl = document.getElementById("passageCount");

  const wordCount = p => p.paras.join(" ").trim().split(/\s+/).length;
  const fmtClock = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function paraHTML(p) {
    return p.paras.map((text, i) => {
      let html = esc(text);
      p.questions.forEach((q, qi) => {
        const e = esc(q.evidence);
        const at = html.indexOf(e);
        if (at >= 0) html = html.slice(0, at) + `<span class="ev" id="ev-${qi}">${e}</span>` + html.slice(at + e.length);
      });
      return `<p><span class="para-no">¶${i + 1}</span>${html}</p>`;
    }).join("");
  }

  function renderPassage() {
    stopTimer(true);
    passageCountEl.textContent = `Set ${setNo} · ${pIdx + 1} / ${PASSAGES.length}`;
    const p = PASSAGES[pIdx];
    const last = pIdx === PASSAGES.length - 1;
    const adv = p.level === "Advanced";

    app.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div class="chips">
            <span class="level ${adv ? "adv" : ""}">${p.level}</span>
            <span class="tag">${p.tag}</span>
          </div>
          <div class="timer" id="timer"></div>
        </div>
        <h2 class="title">${p.title}</h2>
        <div class="meta-line">${wordCount(p)} words · ${p.paras.length} paragraphs</div>
        <div class="passage-text">${paraHTML(p)}</div>
      </div>
      <div class="card">
        <div class="section-label">Questions</div>
        <div id="quizItems"></div>
        <details class="bonus" id="bonus">
          <summary>おまけ：英語で要約してみる（任意）</summary>
          <div class="bonus-body">
            <p>${p.summaryPrompt}</p>
            <textarea class="summary-box" id="summaryBox-${setNo}-${pIdx}" maxlength="600" placeholder="Write one or two sentences in English..."></textarea>
            <div><button class="secondary" id="feedbackBtn">AIに講評してもらう</button></div>
            <div id="feedbackOut"></div>
          </div>
        </details>
        <div class="advance-row">
          <span class="advance-hint" id="advanceHint">4問すべて答えると進めます</span>
          <button class="primary" id="advanceBtn" disabled>${last ? "このセットの結果を見る" : "次の文章へ"}</button>
        </div>
      </div>
    `;

    renderTimerIdle();
    renderQuiz(p);
    document.getElementById("feedbackBtn").addEventListener("click", () => requestFeedback(p));
    document.getElementById("advanceBtn").addEventListener("click", advance);
  }

  /* ---------- optional timer ---------- */
  function renderTimerIdle() {
    const el = document.getElementById("timer");
    const prev = wpmResults[pIdx];
    el.innerHTML = prev
      ? `<span class="wpm">${prev} WPM</span><button id="timerBtn">もう一度計る</button>`
      : `<button id="timerBtn">⏱ 時間を計る</button>`;
    document.getElementById("timerBtn").addEventListener("click", startTimer);
  }
  function startTimer() {
    const el = document.getElementById("timer");
    timer = { start: Date.now(), handle: null };
    el.innerHTML = `<span class="dot"></span><span id="clockText">00:00</span><button id="timerBtn">読み終えた</button>`;
    timer.handle = setInterval(() => {
      const c = document.getElementById("clockText");
      if (c) c.textContent = fmtClock(Date.now() - timer.start);
    }, 1000);
    document.getElementById("timerBtn").addEventListener("click", () => stopTimer(false));
  }
  function stopTimer(silent) {
    if (!timer) return;
    clearInterval(timer.handle);
    const minutes = Math.max((Date.now() - timer.start) / 60000, 0.05);
    timer = null;
    if (silent) return;
    wpmResults[pIdx] = Math.round(wordCount(PASSAGES[pIdx]) / minutes);
    renderTimerIdle();
  }

  /* ---------- questions ---------- */
  function renderQuiz(p) {
    const itemsEl = document.getElementById("quizItems");
    p.questions.forEach((q, qi) => {
      const item = document.createElement("div");
      item.className = "quiz-item";
      item.innerHTML = `<p class="quiz-q"><span class="qtype">Q${qi + 1} · ${q.type}</span>${esc(q.q)}</p><div class="options"></div>`;
      const optsEl = item.querySelector(".options");
      q.options.forEach((opt, oi) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerHTML = `<span class="letter">${LETTERS[oi]}</span><span>${esc(opt)}</span>`;
        btn.addEventListener("click", () => answer(qi, oi, item, q));
        optsEl.appendChild(btn);
      });
      itemsEl.appendChild(item);
      const prev = quizState[pIdx][qi];
      if (prev !== null) showAnswer(qi, prev, item, q);
    });
    updateAdvance();
  }

  function answer(qi, oi, item, q) {
    if (quizState[pIdx][qi] !== null) return;
    quizState[pIdx][qi] = oi;
    showAnswer(qi, oi, item, q);
    updateAdvance();
  }

  function showAnswer(qi, oi, item, q) {
    const ok = oi === q.correct;
    const buttons = item.querySelectorAll(".option");
    buttons.forEach(b => (b.disabled = true));
    buttons[q.correct].classList.add("correct");
    if (!ok) buttons[oi].classList.add("incorrect");

    const ev = document.getElementById(`ev-${qi}`);
    if (ev) {
      ev.classList.add("on");
      if (!ev.querySelector(".ev-tag")) ev.insertAdjacentHTML("beforeend", `<span class="ev-tag">Q${qi + 1}</span>`);
    }
    const para = PASSAGES[pIdx].paras.findIndex(t => t.includes(q.evidence)) + 1;
    const ex = document.createElement("div");
    ex.className = `explain ${ok ? "correct" : "incorrect"}`;
    ex.innerHTML = `${ok ? "正解。" : `正解は ${LETTERS[q.correct]}。`}${esc(q.explain)}` +
      (para ? `<span class="evnote">根拠：本文 ¶${para} の <b>Q${qi + 1}</b> の箇所</span>` : "");
    item.appendChild(ex);
  }

  function updateAdvance() {
    const done = quizState[pIdx].every(v => v !== null);
    document.getElementById("advanceBtn").disabled = !done;
    document.getElementById("advanceHint").hidden = done;
  }

  /* ---------- optional summary ---------- */
  function buildFeedbackPrompt(passage, summaryText) {
    const lvl = passage.level === "Advanced" ? "Eiken Grade 2 to Pre-1, CEFR B1-B2" : "Eiken Grade 2, CEFR B1";
    return `You are an English teacher helping a Japanese adult learner (around ${lvl}) practice short summary writing.

Passage:
"""
${passage.paras.join("\n\n")}
"""

Student's summary (English):
"""
${summaryText}
"""

Respond in Japanese, in 3 to 4 short sentences:
1. Does the summary capture the main point? Mention one missing point if any.
2. One brief note on the English (grammar, word choice, or a more natural phrasing), only if useful. Show the improved sentence.
3. A rough score out of 100.

Be concise and encouraging.`;
  }

  async function requestFeedback(passage) {
    const text = document.getElementById(`summaryBox-${setNo}-${pIdx}`).value.trim();
    const btn = document.getElementById("feedbackBtn");
    const out = document.getElementById("feedbackOut");
    if (!text) { out.innerHTML = `<div class="feedback-panel">先に英文を入力してください。</div>`; return; }
    if (!sampleFn) { out.innerHTML = `<div class="feedback-panel">この環境ではAI講評機能を利用できません。</div>`; return; }

    btn.disabled = true;
    out.innerHTML = `<div class="feedback-panel">講評を書いています…</div>`;
    const panel = out.querySelector(".feedback-panel");
    try {
      const { text: reply } = await sampleFn(buildFeedbackPrompt(passage, text), {
        modelTier: "default",
        onText: ({ text: t }) => { panel.textContent = t; }
      });
      panel.textContent = reply;
    } catch (e) {
      if (e.code === "cancelled") panel.textContent = e.text || "";
      else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) {
        sampleFn = null; panel.textContent = "この環境ではAI講評機能を利用できません。";
      } else if (e.code === "rate_limited") panel.textContent = "少し時間をおいてからもう一度お試しください。";
      else panel.textContent = "講評を取得できませんでした。もう一度お試しください。";
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------- flow ---------- */
  function advance() {
    stopTimer(true);
    const done = PASSAGES[pIdx].title;
    seen[done] = (seen[done] || 0) + 1;
    saveSeen(seen);
    pIdx++;
    if (pIdx < PASSAGES.length) renderPassage();
    else renderResults();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function renderResults() {
    passageCountEl.textContent = `Set ${setNo} · 完了`;
    const correct = PASSAGES.map((p, i) => p.questions.filter((q, qi) => quizState[i][qi] === q.correct).length);
    const byLevel = lvl => {
      const idx = PASSAGES.map((p, i) => p.level === lvl ? i : -1).filter(i => i >= 0);
      return [idx.reduce((a, i) => a + correct[i], 0), idx.reduce((a, i) => a + PASSAGES[i].questions.length, 0)];
    };
    const [sc, st] = byLevel("Standard"), [ac, at] = byLevel("Advanced");
    const timed = wpmResults.filter(Boolean);
    const avg = timed.length ? Math.round(timed.reduce((a, b) => a + b, 0) / timed.length) : null;
    const readCount = POOL.filter(p => seen[p.title]).length;

    app.innerHTML = `
      <div class="card results">
        <div class="big">${sc + ac} / ${st + at}</div>
        <div class="big-label">Set ${setNo} の正答数（Standard ${sc}/${st} · Advanced ${ac}/${at}）</div>
        <div class="breakdown">
          ${PASSAGES.map((p, i) => `<div class="breakdown-row"><span class="label"><span class="level mini ${p.level === "Advanced" ? "adv" : ""}">${p.level === "Advanced" ? "A" : "S"}</span>${p.title}</span><span class="val">${correct[i]}/${p.questions.length}${wpmResults[i] ? ` · ${wpmResults[i]} WPM` : ""}</span></div>`).join("")}
          ${avg ? `<div class="breakdown-row"><span class="label">平均読書速度（計った文章のみ）</span><span class="val">${avg} WPM</span></div>` : ""}
        </div>
        <div class="result-actions">
          <button class="primary" id="nextSetBtn">次のセットへ</button>
          <button class="secondary" id="retryBtn">このセットをもう一度</button>
        </div>
        <p class="pool-note">全${POOL.length}題中 ${readCount}題を読みました。まだ読んでいない文章から優先して出します。</p>
      </div>
    `;
    document.getElementById("nextSetBtn").addEventListener("click", () => {
      const prevTitles = PASSAGES.map(p => p.title);
      PASSAGES = pickSet(prevTitles);
      setNo++;
      resetSetState();
      renderPassage();
    });
    document.getElementById("retryBtn").addEventListener("click", () => {
      resetSetState();
      renderPassage();
    });
  }

  renderPassage();
</script>

</body></html>
