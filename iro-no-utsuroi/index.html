<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>色の移ろい</title>
<style>
  /* 全画面グラデーション。色相を OKLCH 空間で流し、向き（角度）を切り替える */
  :root {
    --ink: rgba(255,255,255,0.86);
    --ink-dim: rgba(255,255,255,0.6);
    --chip: rgba(0,0,0,0.2);
    --chip-on: rgba(255,255,255,0.88);
    --ink-on: rgba(20,20,20,0.9);
    --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: oklch(0.72 0.11 30);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 8px 12px;
    align-items: center;
    pointer-events: none;
    transition: opacity .6s ease;
  }
  .panel.off { opacity: 0; }
  .chip {
    background: var(--chip);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    letter-spacing: .04em;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .hint { color: var(--ink-dim); margin-left: auto; }
  .ctrl { pointer-events: auto; cursor: default; }

  .speed { display: flex; align-items: center; gap: 10px; flex: 1 1 240px; max-width: 380px; }
  .speed label { white-space: nowrap; }
  .speed input { flex: 1; min-width: 0; accent-color: #fff; }
  .speed output { min-width: 7em; text-align: right; }

  .dirs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 6px; }
  .dirs .lbl { padding: 0 6px 0 8px; white-space: nowrap; }
  .dirs button {
    font: inherit; font-size: 13px; letter-spacing: .04em;
    color: var(--ink); background: transparent;
    border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .dirs button[aria-pressed="true"] { background: var(--chip-on); color: var(--ink-on); }
  .dirs button:hover:not([aria-pressed="true"]) { background: rgba(255,255,255,0.14); }
  input:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Zen+Kaku+Gothic+New:wght@400&display=swap">

<div class="panel" id="panel">
  <span class="chip num" id="readout">30° → 150°</span>

  <div class="chip speed ctrl">
    <label for="speed">速さ</label>
    <input type="range" id="speed" min="0" max="100" step="1" value="40" aria-describedby="speedOut">
    <output class="num" id="speedOut">一周 2分</output>
  </div>

  <div class="chip speed ctrl">
    <label for="spread">色の幅</label>
    <input type="range" id="spread" min="0" max="360" step="5" value="120" aria-describedby="spreadOut">
    <output class="num" id="spreadOut">120°</output>
  </div>

  <div class="chip dirs ctrl" role="group" aria-label="向き">
    <span class="lbl">向き</span>
    <button type="button" id="d-h"   data-mode="h"   aria-pressed="true">横</button>
    <button type="button" id="d-v"   data-mode="v"   aria-pressed="false">縦</button>
    <button type="button" id="d-d1"  data-mode="d1"  aria-pressed="false">斜め↘</button>
    <button type="button" id="d-d2"  data-mode="d2"  aria-pressed="false">斜め↗</button>
    <button type="button" id="d-rot" data-mode="rot" aria-pressed="false">回転</button>
    <button type="button" id="d-rad" data-mode="rad" aria-pressed="false">放射</button>
  </div>

  <span class="chip hint" id="hint">タップで一時停止／再開</span>
</div>

<script>
  // 明度 L・彩度 C は固定。端から端まで色相が SPREAD 度ずれる帯を作り、全体を時間とともに回す
  const L = 0.72, C = 0.11, STOPS = 17;
  let SPREAD = 120;
  const MIN_DPS = 0.3, MAX_DPS = 60;          // 一周20分〜6秒
  const ANGLES = { h: 90, v: 180, d1: 135, d2: 45 };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let DEG_PER_SEC = reduce ? 1 : 3;
  let hue = 30, angle = 90, mode = 'h';
  let running = true, last = performance.now(), idle = 0;

  const body = document.body;
  const readout = document.getElementById('readout');
  const hint = document.getElementById('hint');
  const panel = document.getElementById('panel');

  function stops() {
    const s = [];
    for (let i = 0; i < STOPS; i++) {
      const h = (hue + SPREAD * i / (STOPS - 1)) % 360;
      s.push(`oklch(${L} ${C} ${h.toFixed(1)}) ${(100 * i / (STOPS - 1)).toFixed(1)}%`);
    }
    return s.join(', ');
  }

  function paint() {
    const g = mode === 'rad'
      ? `radial-gradient(circle at 50% 50%, ${stops()})`
      : `linear-gradient(${angle.toFixed(1)}deg, ${stops()})`;
    body.style.background = g;
    const a = Math.round(hue), b = Math.round((hue + SPREAD) % 360);
    const dir = mode === 'rad' ? '放射' : `${Math.round(angle) % 360}°`;
    readout.textContent = `${a}° → ${b}° ・ ${dir}`;
  }

  function tick(now) {
    const dt = (now - last) / 1000; last = now;
    if (running) {
      hue = (hue + DEG_PER_SEC * dt) % 360;
      // 回転モードでは向きも回す（色の速さの半分）
      if (mode === 'rot') angle = (angle + DEG_PER_SEC * 0.5 * dt) % 360;
      paint();
    }
    idle += dt;
    panel.classList.toggle('off', running && idle > 4);
    requestAnimationFrame(tick);
  }

  body.addEventListener('click', () => {
    running = !running; idle = 0;
    hint.textContent = running ? 'タップで一時停止／再開' : '停止中 — タップで再開';
  });
  addEventListener('pointermove', () => { idle = 0; });

  // 速さ（対数スライダー）
  const slider = document.getElementById('speed');
  const out = document.getElementById('speedOut');
  const toSlider = d => Math.round(100 * Math.log(d / MIN_DPS) / Math.log(MAX_DPS / MIN_DPS));
  const fromSlider = v => MIN_DPS * Math.pow(MAX_DPS / MIN_DPS, v / 100);
  function showSpeed() {
    const sec = 360 / DEG_PER_SEC;
    out.textContent = sec >= 60 ? `一周 ${(sec / 60).toFixed(sec >= 600 ? 0 : 1)}分` : `一周 ${Math.round(sec)}秒`;
  }
  slider.value = toSlider(DEG_PER_SEC);
  slider.addEventListener('input', () => { DEG_PER_SEC = fromSlider(+slider.value); idle = 0; showSpeed(); });

  // 色の幅（端から端までの色相のずれ）
  const spread = document.getElementById('spread');
  const spreadOut = document.getElementById('spreadOut');
  function showSpread() {
    spreadOut.textContent = SPREAD === 0 ? '0°（一色）' : SPREAD === 360 ? '360°（全色）' : `${SPREAD}°`;
  }
  spread.addEventListener('input', () => { SPREAD = +spread.value; idle = 0; showSpread(); paint(); });

  // 向き
  const buttons = document.querySelectorAll('.dirs button');
  buttons.forEach(btn => btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    if (mode in ANGLES) angle = ANGLES[mode];
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    paint();
  }));

  document.querySelectorAll('.ctrl').forEach(el =>
    ['click', 'pointerdown'].forEach(t => el.addEventListener(t, e => { e.stopPropagation(); idle = 0; })));

  showSpeed();
  showSpread();
  paint();
  requestAnimationFrame(tick);
</script>

</body></html>
